[project]
name = "watchlib"
version = "0.1.0"
description = "Watch a changing number in the terminal: formatting, colours, thresholds, alerts"
requires-python = ">=3.10"
dependencies = [
    "rich>=13",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["watchlib*"]
