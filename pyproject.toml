[project]
name = "watchlib"
version = "0.1.0"
description = "Watch a changing number in the terminal: formatting, colours, thresholds, alerts"
requires-python = ">=3.10"
dependencies = [
    "rich>=13",
]

# Only needed for make_speech(), which generates spoken alert files. Everything else
# works without it, and sound.py degrades quietly when it is missing.
#   pip install "watchlib[speech]"
[project.optional-dependencies]
speech = ["gtts"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["watchlib*"]
